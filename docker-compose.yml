services:
    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${NGINX_PORT:-8080}:80'
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        depends_on:
            - app

    app:
        build:
            context: ./docker/php
        volumes:
            - .:/var/www/html
        ports:
            - '${VITE_PORT:-5173}:5173'
        environment:
            # DB_* deliberately isn't forwarded here — Laravel already reads
            # it from the bind-mounted .env (or .env.testing under APP_ENV=
            # testing). Forwarding it as a real container env var would
            # shadow that: Dotenv never overwrites a variable the process
            # environment already has, so .env.testing's separate DB_DATABASE
            # would be silently ignored and every Pest run would migrate and
            # RefreshDatabase the same database the dev container just seeded.
            #
            # Xdebug's own trigger mode keeps it off request paths, but the
            # extension stays loaded either way — composer's own PHP process
            # pays that overhead too, turning a cold `composer install`
            # several times slower. Nothing needs a debugger attached to run
            # e2e tests against the stack, so CI overrides this to "off".
            XDEBUG_MODE: ${XDEBUG_MODE:-debug}
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:18
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-app}
            POSTGRES_USER: ${POSTGRES_USER:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - db_data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    db_data:
